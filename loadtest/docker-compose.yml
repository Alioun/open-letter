# Load-test stack: the production image under VPS-like CPU/RAM limits, a Mailpit
# SMTP sink so sign-ups exercise the real email path without sending anything,
# and k6. Uses throwaway secrets from .env.loadtest (see gen-env.sh) and its own
# volumes, never your real .env or data.
#
#   ./loadtest/gen-env.sh
#   APP_CPUS=1 APP_MEM=1g docker compose -f loadtest/docker-compose.yml up -d app mailpit
#
# See loadtest/README.md.
name: diaetendeckel-loadtest

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env.loadtest
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=http://app:3000
      - DATABASE_PATH=/app/data/diaetendeckel.db
      - DATABASE_JOURNAL_MODE=${DATABASE_JOURNAL_MODE:-DELETE}
      - LETTER_CONFIG=${LETTER_CONFIG:-gehaltsdeckel}
      - TRUST_PROXY=true
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SECURE=false
      - BACKUP_DIR=/app/backups
    volumes:
      - data:/app/data
      - backups:/app/backups
      # Mount the harness so seeder edits don't need an image rebuild.
      - ./:/app/loadtest:ro
    ports:
      - "127.0.0.1:3900:3000"
    cpus: ${APP_CPUS:-1}
    mem_limit: ${APP_MEM:-1g}
    memswap_limit: ${APP_MEM:-1g}
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    environment:
      - MP_MAX_MESSAGES=5000
    ports:
      - "127.0.0.1:3901:8025"

  k6:
    image: grafana/k6:latest
    profiles: ["k6"]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      - BASE_URL=http://app:3000
    # No depends_on: starting k6 must never recreate the app container and
    # silently reset the CPU/memory limits under test.

volumes:
  data:
  backups:
